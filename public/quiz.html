<!DOCTYPE html>
<html>
<head>
  <title>Career AI Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="quiz-bg">

  <!-- ===== NAVBAR ===== -->
  <div class="navbar">
    <div class="nav-content">
      <img src="logo.png" class="logo" />
      <h1 class="brand-text">Career Booth <span>AI</span></h1>
    </div>
  </div>

  <!-- ===== PROGRESS BAR (SEPARATE LAYER) ===== -->
  <div class="progress-wrapper">
    <p id="progressText">Question 0 / 15</p>
    <div class="progress-bar">
      <div id="progressFill"></div>
    </div>
  </div>

  <!-- ===== QUIZ BOX ===== -->
  <div class="quiz-box">
    <h2 id="question">Click Start to Begin</h2>

    <input type="text" id="answer" placeholder="Type your answer here..." />

    <button id="startBtn" onclick="startQuiz()">Start</button>
    <button id="nextBtn" onclick="submitAnswer()" style="display:none;">Next</button>
  </div>

  <script src="script.js"></script>

</body>
</html>
